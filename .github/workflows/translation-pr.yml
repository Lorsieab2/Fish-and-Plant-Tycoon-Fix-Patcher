name: Translation pull request

# Every pull request that touches translations/ (the public translations folder, see
# translations/README.md) gets two checks, in this order:
#
# 1. "scan": every submitted file is pre-checked (a UTF-8 .tsv or .txt of at most 2 MB under
#    translations/fish/ or translations/plant/, nothing else) and sent to VirusTotal
#    (scripts/virustotal_scan.py). Any engine that flags it, or no answer at all, fails.
# 2. "validate" (needs: scan): the format, keys, placeholders, person and number choices and email
#    addresses (scripts/check_translation_pr.py), each refusal naming its line.
# Both comment their result on the pull request. The owner accepts by merging; the
# "accept-translation" label runs both checks again.
#
# SECURITY. pull_request_target runs THIS file and the scripts from the BASE branch, so a pull
# request from a fork can be commented on. The pull request's code is never checked out or run:
# actions/checkout takes the base branch (no ref), and the changed files are fetched only through
# the GitHub API, as data, at most 2 MB each. Nothing from the pull request is ever put into a shell
# command: the scripts read the event file themselves. The VirusTotal key reaches only the scan step,
# as an environment variable.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "translations/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: translation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.event.action != 'labeled' || github.event.label.name == 'accept-translation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the submitted files with VirusTotal (as data only)
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I scripts/virustotal_scan.py --pr "$RUNNER_TEMP/scan"

  validate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the translation files (as data only, at most 2 MB each)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I scripts/check_translation_pr.py "$RUNNER_TEMP/translation"
