name: Scan accepted translations

# Accepted translations are scanned again once they are on main: every translation file a push to
# main adds or changes under translations/ goes through the same pre-check and VirusTotal scan as a
# pull request (scripts/virustotal_scan.py --push). A flagged file, or one that could not be scanned,
# fails this run so the owner sees it. The key reaches only the scan step, as an environment variable.

on:
  push:
    branches: [main]
    paths:
      - "translations/**"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the changed translation files with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python -I scripts/virustotal_scan.py --push "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/scan"
